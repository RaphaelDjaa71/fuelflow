[project]
name = "fuelflow"
version = "0.1.0"
description = "Modern Data Stack on French fuel prices (roulez-eco open data)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pre-commit>=4.0",
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
