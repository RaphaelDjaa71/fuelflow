[project]
name = "fuelflow"
version = "0.1.0"
description = "Modern Data Stack on French fuel prices (roulez-eco open data)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "polars>=1.0",
  "pyarrow>=16.0",
  "google-cloud-storage>=2.18",
  "structlog>=24.0",
  "tenacity>=9.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-httpx>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
pythonpath = ["ingestion"]
