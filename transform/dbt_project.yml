name: 'fuelflow'
version: '0.1.0'
config-version: 2

profile: 'fuelflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  source_timezone: 'Europe/Paris'

models:
  fuelflow:
    staging:
      +materialized: view
      +tags: ["staging"]
